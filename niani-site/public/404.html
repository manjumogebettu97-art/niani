<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Niani Designs</title>
    <script>
      // GitHub Pages has no server-side rewrite, so a direct hit on /niani/work
      // lands here instead of index.html. Encode the requested path into a query
      // string and bounce to index.html, which restores it before React mounts.
      // pathSegmentsToKeep = 1 because the site is served from the /niani/ subpath.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
